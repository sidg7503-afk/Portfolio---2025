<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sid — Vibe Coder & AI Builder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #080808;
      --text: #f0ede8;
      --amber: #f59e0b;
      --gray: #888888;
      --glass: rgba(15, 15, 15, 0.4);
      --glass-border: rgba(245, 158, 11, 0.15);
      --mono: 'Space Mono', monospace;
      --display: 'Syne', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; cursor: none; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--mono);
      overflow-x: hidden;
    }

    /* CUSTOM CURSOR */
    #cursor {
      position: fixed; width: 12px; height: 12px;
      background: var(--amber); border-radius: 50%;
      pointer-events: none; z-index: 9999;
      transform: translate(-50%, -50%);
      transition: width 0.2s, height 0.2s;
    }
    #cursor-ring {
      position: fixed; width: 40px; height: 40px;
      border: 1px solid rgba(245, 158, 11, 0.4); border-radius: 50%;
      pointer-events: none; z-index: 9998;
      transform: translate(-50%, -50%);
      transition: transform 0.1s;
    }

    /* 3D BACKGROUND */
    #webgl-container {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      z-index: 0; pointer-events: none;
    }

    /* UI LAYER */
    #ui-layer {
      position: relative; z-index: 10;
      width: 100%; min-height: 100vh;
      display: flex; flex-direction: column; justify-content: center;
      padding: 0 5vw;
    }

    nav {
      position: absolute; top: 0; left: 0; width: 100%;
      padding: 30px 5vw; display: flex; justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-family: var(--display); font-size: 1.5rem; font-weight: 800;
      color: var(--text); letter-spacing: -1px;
    }
    .logo span { color: var(--amber); }

    .status {
      display: flex; align-items: center; gap: 10px;
      font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em;
      background: var(--glass); padding: 8px 16px; border-radius: 50px;
      border: 1px solid var(--glass-border); backdrop-filter: blur(10px);
    }
    .status-dot {
      width: 8px; height: 8px; background: #22c55e; border-radius: 50%;
      box-shadow: 0 0 10px #22c55e; animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; }
    }

    /* HERO CONTENT */
    .hero-content {
      max-width: 800px;
      margin-top: 10vh;
    }

    .tagline {
      font-size: 0.8rem; color: var(--amber); letter-spacing: 0.2em;
      text-transform: uppercase; margin-bottom: 20px;
      display: flex; align-items: center; gap: 12px;
    }
    .tagline::before { content: ''; width: 40px; height: 1px; background: var(--amber); }

    h1 {
      font-family: var(--display);
      font-size: clamp(3.5rem, 8vw, 7rem);
      line-height: 0.9; letter-spacing: -2px;
      margin-bottom: 20px;
    }

    .terminal {
      font-size: 1rem; color: var(--gray); margin-bottom: 40px;
      line-height: 1.6; max-width: 600px;
    }
    .cursor-blink {
      display: inline-block; width: 10px; height: 1em;
      background: var(--amber); vertical-align: middle;
      animation: blink 1s step-end infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

    /* TICKER */
    .glass-panel {
      background: var(--glass); backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border); border-radius: 8px;
      padding: 30px; max-width: 500px;
    }

    .ticker-title {
      font-size: 0.7rem; color: var(--gray); letter-spacing: 0.15em;
      text-transform: uppercase; margin-bottom: 20px; border-bottom: 1px solid var(--glass-border); padding-bottom: 10px;
    }

    .ticker-item {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 15px; font-size: 0.85rem;
    }
    .ticker-item:last-child { margin-bottom: 0; }
    
    .badge-build { color: var(--amber); background: rgba(245, 158, 11, 0.1); padding: 4px 10px; border-radius: 4px; font-size: 0.7rem; }
    .badge-live { color: #22c55e; background: rgba(34, 197, 94, 0.1); padding: 4px 10px; border-radius: 4px; font-size: 0.7rem; }

  </style>
</head>
<body>

  <div id="cursor"></div>
  <div id="cursor-ring"></div>

  <div id="webgl-container"></div>

  <div id="ui-layer">
    <nav>
      <div class="logo">SID<span>.</span></div>
      <div class="status"><div class="status-dot"></div>Open to Collabs</div>
    </nav>

    <div class="hero-content">
      <div class="tagline">Portfolio 2025</div>
      <h1>I build<br>with AI.</h1>
      
      <div class="terminal" id="terminal-text">
        <span class="cursor-blink"></span>
      </div>

      <div class="glass-panel">
        <div class="ticker-title">Active Deployments</div>
        <div class="ticker-item">
          <span>Cortex AI Tutor</span>
          <span class="badge-build">Building</span>
        </div>
        <div class="ticker-item">
          <span>FUNTECHBLAZE</span>
          <span class="badge-live">Live</span>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>

  <script>
    // --- Custom Cursor Logic ---
    const cursor = document.getElementById('cursor');
    const ring = document.getElementById('cursor-ring');
    let mx = 0, my = 0, rx = 0, ry = 0;
    
    document.addEventListener('mousemove', e => {
      mx = e.clientX; my = e.clientY;
      cursor.style.left = mx + 'px'; cursor.style.top = my + 'px';
    });

    function renderCursor() {
      rx += (mx - rx) * 0.15; ry += (my - ry) * 0.15;
      ring.style.left = rx + 'px'; ring.style.top = ry + 'px';
      requestAnimationFrame(renderCursor);
    }
    renderCursor();

    // --- Terminal Typing Effect ---
    const phrases = [
      "> Acting as the Architect.",
      "> Orchestrating AI models to write code.",
      "> Designing intuitive user experiences.",
      "> A Vibe Coder from India."
    ];
    let pIdx = 0, cIdx = 0, isDeleting = false;
    const termEl = document.getElementById('terminal-text');

    function typeTerminal() {
      const currentPhrase = phrases[pIdx];
      if (!isDeleting) {
        termEl.innerHTML = currentPhrase.slice(0, cIdx + 1) + '<span class="cursor-blink"></span>';
        cIdx++;
        if (cIdx === currentPhrase.length) { isDeleting = true; setTimeout(typeTerminal, 2000); return; }
      } else {
        termEl.innerHTML = currentPhrase.slice(0, cIdx - 1) + '<span class="cursor-blink"></span>';
        cIdx--;
        if (cIdx === 0) { isDeleting = false; pIdx = (pIdx + 1) % phrases.length; }
      }
      setTimeout(typeTerminal, isDeleting ? 30 : 60);
    }
    setTimeout(typeTerminal, 1000);

    // --- 3D Three.js Interactive Background ---
    const container = document.getElementById('webgl-container');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 300;

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    container.appendChild(renderer.domElement);

    // Generate Golden/Amber Particles
    const particleCount = 500;
    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(particleCount * 3);

    for (let i = 0; i < particleCount; i++) {
      positions[i * 3] = (Math.random() - 0.5) * 800; // x
      positions[i * 3 + 1] = (Math.random() - 0.5) * 800; // y
      positions[i * 3 + 2] = (Math.random() - 0.5) * 800; // z
    }
    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

    const pMaterial = new THREE.PointsMaterial({
      color: 0xf59e0b, // Amber color
      size: 2,
      transparent: true,
      opacity: 0.6,
      blending: THREE.AdditiveBlending
    });

    const particles = new THREE.Points(geometry, pMaterial);
    scene.add(particles);

    // Add connecting lines (Constellation effect)
    const lineMaterial = new THREE.LineBasicMaterial({ color: 0xf59e0b, transparent: true, opacity: 0.08 });
    const linePositions = [];
    for (let i = 0; i < particleCount; i++) {
      for (let j = i + 1; j < particleCount; j++) {
        const dx = positions[i*3] - positions[j*3];
        const dy = positions[i*3+1] - positions[j*3+1];
        const dz = positions[i*3+2] - positions[j*3+2];
        if (Math.sqrt(dx*dx + dy*dy + dz*dz) < 60) {
          linePositions.push(positions[i*3], positions[i*3+1], positions[i*3+2], positions[j*3], positions[j*3+1], positions[j*3+2]);
        }
      }
    }
    const lineGeometry = new THREE.BufferGeometry();
    lineGeometry.setAttribute('position', new THREE.Float32BufferAttribute(linePositions, 3));
    const lines = new THREE.LineSegments(lineGeometry, lineMaterial);
    scene.add(lines);

    // Mouse Parallax Interaction
    let targetX = 0, targetY = 0;
    document.addEventListener('mousemove', (event) => {
      targetX = (event.clientX - window.innerWidth / 2) * 0.1;
      targetY = (event.clientY - window.innerHeight / 2) * 0.1;
    });

    function animate3D() {
      requestAnimationFrame(animate3D);
      // Smooth camera pan
      camera.position.x += (targetX - camera.position.x) * 0.05;
      camera.position.y += (-targetY - camera.position.y) * 0.05;
      camera.lookAt(scene.position);
      
      // Auto rotation
      particles.rotation.x += 0.0003;
      particles.rotation.y += 0.0005;
      lines.rotation.x += 0.0003;
      lines.rotation.y += 0.0005;

      renderer.render(scene, camera);
    }
    animate3D();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
  </html>
